name: Deploy Supabase database

on:
  push:
    branches: [database_skeleton]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "backend/database/seed.sql"
      - ".github/workflows/deploy-database.yml"
  pull_request:
    branches: [database_skeleton, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "backend/database/seed.sql"
      - ".github/workflows/deploy-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migrations and local seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start local database
        run: supabase db start
      - name: Rebuild local database from migrations
        run: supabase db reset --local --yes
      - name: Check database schema
        run: supabase db lint --local --level error --fail-on error
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy database_skeleton to Supabase
    needs: validate
    if: github.ref == 'refs/heads/database_skeleton' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Check required secrets
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        run: supabase db push --yes

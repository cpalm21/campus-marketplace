spring.application.name=backend

# Defaults target local Supabase. Hosted credentials must come from the environment.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:54322/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
# Schema changes are managed by Supabase migrations, not application startup.
spring.sql.init.mode=never
